<!DOCTYPE html>
<html>
<head>
  <title>Квадраты</title>
  <style>
    div {
      position: absolute;
    }

    .red {
      width: 300px;
      height: 100px;
      background: red;
      left: 20px;
      top: 20px;
    }

    .green1 {
      width: 200px;
      height: 200px;
      background: green;
      left: 320px;
      top: 20px;
    }

    .yellow1 {
      width: 200px;
      height: 200px;
      background: yellow;
      left: 320px;
      top: 220px;
    }

    .blue {
      width: 300px;
      height: 100px;
      background: blue;
      left: 320px;
      top: 420px;
    }

    .green2 {
      width: 200px;
      height: 200px;
      background: green;
      left: 20px;
      top: 220px;
    }

    .yellow2 {
      width: 200px;
      height: 200px;
      background: yellow;
      left: 20px;
      top: 420px;
    }
  </style>
</head>
<body>
  <div class="red"></div>
  <div class="green1"></div>
  <div class="yellow1"></div>
  <div class="blue"></div>
  <div class="green2"></div>
  <div class="yellow2"></div>
</body>
</html>
